</div><section id="pdfSection" class="hidden"><div class="docs-toolbar"><input id="docSearch" type="search" placeholder="搜索资料名称…" aria-label="搜索PDF"><select id="docSubject" aria-label="科目"><option value="全部">全部科目</option></select><select id="docType" aria-label="资料用途"><option value="全部">全部用途</option></select></div><div class="quick-actions"><button id="refreshDocs" type="button">↻ 刷新资料</button><button id="recentDoc" type="button">↗ 上次阅读</button></div><div id="docBreadcrumb" class="doc-breadcrumb"></div><div id="docCount" class="count">正在读取 PDF 资料…</div><div id="docReader" class="doc-reader hidden"><div class="reader-head"><div id="readerTitle" class="reader-title">PDF 阅读器</div><div class="reader-actions"><button id="fitWidth" type="button">适应宽度</button><button id="prevPage" type="button" aria-label="上一页">‹ 上一页</button><input id="pageNum" type="number" min="1" value="1" aria-label="页码"><span id="pageTotal">/ —</span><button id="nextPage" type="button" aria-label="下一页">下一页 ›</button><button id="zoomOut" type="button" aria-label="缩小">−</button><button id="zoomIn" type="button" aria-label="放大">＋</button><a id="pdfOriginal" target="_blank" rel="noopener">原文件 ↗</a><button id="closeReader" type="button">关闭</button></div></div><div id="pdfStatus" class="pdf-status">准备加载…</div><div id="pdfCanvasWrap" class="pdf-canvas-wrap"><canvas id="pdfCanvas"></canvas></div></div><div id="docList"></div></section><div class="foot">☁ 蓬莱仙境 · 地雷放映室 · 文运常在 · 播放进度保存在当前设备</div>
</main>
<script>
'use strict';
// 这里填写已经部署成功的 CloudBase HTTP 网关地址。
const API_URL = 'https://miserable-duck-d2gabcz5jbdea7a4f-1326703780.ap-shanghai.app.tcloudbase.com/videos';
const $ = id => document.getElementById(id);
const player=$('player'),list=$('list');
let allVideos=[],selectedId='',saveTick=0,videoFolder=null,favoritesOnly=false;
const numberOf=name=>{const m=String(name||'').match(/^\s*(\d+)/);return m?Number(m[1]):Infinity};
const duration=s=>{s=Math.floor(Number(s)||0);return s?`${Math.floor(s/3600)?Math.floor(s/3600)+':':''}${String(Math.floor(s%3600/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`:'时长未知'};
const storageKey=id=>'mine-room-progress-'+id;const favoriteKey='mine-room-favorites';function favorites(){try{return JSON.parse(localStorage.getItem(favoriteKey)||'[]')}catch{return []}}function toggleFavorite(id){const set=new Set(favorites());set.has(id)?set.delete(id):set.add(id);localStorage.setItem(favoriteKey,JSON.stringify([...set]));render()}
function getProgress(id){try{return JSON.parse(localStorage.getItem(storageKey(id))||'{}')}catch{return {}}}
function saveProgress(){if(!selectedId||!Number.isFinite(player.currentTime))return;try{localStorage.setItem(storageKey(selectedId),JSON.stringify({time:player.currentTime,duration:player.duration||0}))}catch{}}
function categoryOf(name){const n=String(name||'').replace(/^\s*\d+\s*[.、．_\-：:]?\s*/,'');if(/史纲|史论|近代史/.test(n))return '史纲';if(/新思想|习思想/.test(n))return '新思想';if(/毛中特|毛概/.test(n))return '毛中特';if(/马原|马克思主义基本原理/.test(n))return '马原';if(/思修|道法|思想道德/.test(n))return '思修法基';return '其他课程'}
function filtered(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value,order=$('order').value;return allVideos.filter(v=>(cat==='all'||categoryOf(v.name)===cat)&&v.name.toLowerCase().includes(q)&&(!favoritesOnly||favorites().includes(v.fileId))).sort((a,b)=>order==='new'?String(b.createTime).localeCompare(String(a.createTime)):order==='desc'?(numberOf(b.name)-numberOf(a.name)||b.name.localeCompare(a.name,'zh-CN',{numeric:true})):(numberOf(a.name)-numberOf(b.name)||a.name.localeCompare(b.name,'zh-CN',{numeric:true})))}
function videoNavigate(folder=null){videoFolder=folder;$('category').value=folder||'all';$('search').value='';render();$('videoBreadcrumb').scrollIntoView({behavior:'smooth',block:'nearest'})}
function render(){const arr=filtered();const searching=!!$('search').value.trim();$('count').textContent=`共 ${allVideos.length} 节课程 · 当前范围 ${arr.length} 节`;list.replaceChildren();const crumb=$('videoBreadcrumb');crumb.replaceChildren();const back=document.createElement('button');back.type='button';back.textContent='全部课程';back.onclick=()=>videoNavigate();crumb.append(back);if(videoFolder){const current=document.createElement('span');current.textContent=' › '+videoFolder;crumb.append(current)}if(!arr.length){const m=document.createElement('div');m.className='message';m.textContent='没有找到符合条件的课程';list.append(m);return}
if(!videoFolder&&!searching&&$('category').value==='all'&&!favoritesOnly){const categories=[...new Set(arr.map(v=>categoryOf(v.name)))];for(const category of categories){const b=document.createElement('button');b.type='button';b.className='doc-folder';const left=document.createElement('span');left.textContent='📁 '+category;const right=document.createElement('span');right.className='doc-folder-count';right.textContent=arr.filter(v=>categoryOf(v.name)===category).length+' 节 ›';b.append(left,right);b.onclick=()=>videoNavigate(category);list.append(b)}return}
for(const v of arr){const b=document.createElement('button');b.type='button';b.className='item'+(v.fileId===selectedId?' active':'');const img=document.createElement('img');img.className='thumb';img.alt='';img.loading='lazy';if(v.cover)img.src=v.cover;const content=document.createElement('div');content.className='item-text';const title=document.createElement('div');title.className='item-title';title.textContent=v.name;const sub=document.createElement('div');sub.className='item-sub';sub.textContent=`🥔 ${categoryOf(v.name)} · ${duration(v.duration)}`;const track=document.createElement('div');track.className='track';const bar=document.createElement('span');const p=getProgress(v.fileId);bar.style.width=(p.duration?Math.min(100,100*(p.time||0)/p.duration):0)+'%';track.append(bar);content.append(title,sub,track);const star=document.createElement('span');star.className='favorite-star';star.textContent=favorites().includes(v.fileId)?'★':'☆';star.title='收藏或取消收藏';star.setAttribute('role','button');star.setAttribute('aria-label','收藏课程');star.tabIndex=0;star.addEventListener('click',e=>{e.stopPropagation();toggleFavorite(v.fileId)});star.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();e.stopPropagation();toggleFavorite(v.fileId)}});b.append(img,content,star);b.addEventListener('click',()=>playVideo(v));list.append(b)}}
function playVideo(v){if(!v.url){alert('该视频暂时没有可用的播放地址');return}saveProgress();selectedId=v.fileId;try{localStorage.setItem('mine-room-last-video',v.fileId)}catch{}player.pause();player.src=v.url;player.style.display='block';$('empty').style.display='none';$('nowTitle').textContent=v.name;$('nowMeta').textContent=`${categoryOf(v.name)} · ${duration(v.duration)} · 自动记录观看进度`;const saved=getProgress(v.fileId);player.onloadedmetadata=()=>{if(saved.time>5&&saved.time<player.duration-5){try{player.currentTime=saved.time}catch{}}};player.play().catch(()=>{});if(!videoFolder){videoFolder=categoryOf(v.name);$('category').value=videoFolder}render()}
player.addEventListener('timeupdate',()=>{if(Date.now()-saveTick>3000){saveTick=Date.now();saveProgress()}});player.addEventListener('pause',saveProgress);player.addEventListener('ended',saveProgress);window.addEventListener('pagehide',saveProgress);
for(const id of ['search','category','order'])$(id).addEventListener(id==='search'?'input':'change',()=>{if(id==='category')videoFolder=$('category').value==='all'?null:$('category').value;render()});
async function loadVideos(){try{const response=await fetch(API_URL,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.videos))throw new Error('接口未返回 videos 数组');allVideos=data.videos.filter(v=>v&&v.fileId&&v.name);const categories=[...new Set(allVideos.map(v=>categoryOf(v.name)))].sort((a,b)=>a.localeCompare(b,'zh-CN'));$('category').replaceChildren(new Option('全部课程','all'),...categories.map(c=>new Option(c,c)));render()}catch(err){$('count').textContent='视频列表读取失败';list.replaceChildren();const m=document.createElement('div');m.className='message';m.textContent=`加载失败：${err.message}。请检查云函数 /videos 是否可访问。`;const retry=document.createElement('button');retry.className='reload';retry.textContent='重试';retry.addEventListener('click',loadVideos);m.append(retry);list.append(m)}}

const DOC_OWNER='ustarrise',DOC_REPO='mine-video-player';
const docsState={level:0,subject:null,type:null,files:[],doc:null,pdf:null,page:1,scale:1,rendering:false,queued:null,lib:null,token:0};
const doc$=id=>document.getElementById(id);
function docSubject(name,path){const s=name+' '+path;if(/英语|作文|English|writing|阅读理解|翻译|词汇|单词|词根|柴荣|救命版/i.test(s))return '英语';if(/政治|马原|毛中特|史纲|思修|抗日|党史|肖秀荣|徐涛|背诵|带背|修法|思想道德|新思想|习思想/.test(s))return '政治';if(/数学|高数|线代|概率|880/.test(s))return '数学';if(/408|计组|操作系统|计算机网络|数据结构/.test(s))return '408';return '其他'}
function docType(name,path){const s=name+' '+path;if(/作文|写作|writing|柴荣|救命版/i.test(s))return '作文';if(/单词|词汇|词根|词缀|考研词/i.test(s))return '单词';if(/思修|修法|思想道德|道德与法治/.test(s))return '思修';if(/马原|马克思主义基本原理/.test(s))return '马原';if(/毛中特|毛概|毛泽东思想/.test(s))return '毛中特';if(/史纲|近代史|抗日|党史/.test(s))return '史纲';if(/时间轴|时间线|年表/.test(s))return '时间轴';if(/习思想|新思想/.test(s))return '新思想';if(/真题|历年试题|试卷/.test(s))return '真题';if(/背诵|带背|必背|速记|冲刺|口诀/.test(s))return '背诵资料';if(/讲义|笔记|知识点|课程|教材|提纲/.test(s))return '讲义';return '其他资料'}
function switchTab(tab){const pdf=tab==='pdf';doc$('videoSection').classList.toggle('hidden',pdf);doc$('pdfSection').classList.toggle('hidden',!pdf);doc$('videoTab').classList.toggle('active',!pdf);doc$('pdfTab').classList.toggle('active',pdf);if(pdf){player.pause();if(!docsState.files.length)loadDocs()}else if(docsState.pdf){/* 保留阅读位置 */}try{history.replaceState(null,'',pdf?'#pdf':'#video')}catch{}}
doc$('videoTab').addEventListener('click',()=>switchTab('video'));doc$('pdfTab').addEventListener('click',()=>switchTab('pdf'));
function ghRaw(path){return 'https://raw.githubusercontent.com/'+DOC_OWNER+'/'+DOC_REPO+'/main/'+path.split('/').map(encodeURIComponent).join('/')}
async function loadDocs(){doc$('docCount').textContent='正在扫描 GitHub 仓库中的 PDF…';try{
const files=[];async function scan(path,depth){if(depth>4)return;const url='https://api.github.com/repos/'+DOC_OWNER+'/'+DOC_REPO+'/contents/'+path+'?ref=main';const r=await fetch(url,{headers:{Accept:'application/vnd.github+json'}});if(!r.ok)throw Error('GitHub 文件列表 HTTP '+r.status);const items=await r.json();if(!Array.isArray(items))return;for(const f of items){if(f.type==='file'&&/\.pdf$/i.test(f.name)){files.push({name:f.name.replace(/\.pdf$/i,''),path:f.path,size:f.size,subject:docSubject(f.name,f.path),type:docType(f.name,f.path),url:ghRaw(f.path)})}else if(f.type==='dir'&&!/^\./.test(f.name))await scan(f.path,depth+1)}}
await scan('',0);docsState.files=files.sort((a,b)=>a.subject.localeCompare(b.subject,'zh-CN')||a.type.localeCompare(b.type,'zh-CN')||a.name.localeCompare(b.name,'zh-CN',{numeric:true}));
doc$('docSubject').replaceChildren(new Option('全部科目','全部'),...[...new Set(files.map(f=>f.subject))].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(s=>new Option(s,s)));
doc$('docType').replaceChildren(new Option('全部用途','全部'),...[...new Set(files.map(f=>f.type))].sort((a,b)=>a.localeCompare(b,'zh-CN')).map(s=>new Option(s,s)));
renderDocs()}catch(e){doc$('docCount').textContent='资料加载失败：'+e.message;doc$('docList').replaceChildren();const b=document.createElement('button');b.className='reload';b.textContent='重新加载';b.onclick=loadDocs;doc$('docList').append(b)}}
function docNav(level,subject=null,type=null){docsState.level=level;docsState.subject=subject;docsState.type=type;doc$('docSubject').value=subject||'全部';doc$('docType').value=type||'全部';doc$('docSearch').value='';renderDocs();doc$('pdfSection').scrollIntoView({behavior:'smooth',block:'start'})}
function docFolder(label,count,onClick){const b=document.createElement('button');b.className='doc-folder';b.type='button';const left=document.createElement('span');left.textContent='📁 '+label;const right=document.createElement('span');right.className='doc-folder-count';right.textContent=count+' 份  ›';b.append(left,right);b.onclick=onClick;return b}
function docFile(d){const b=document.createElement('div');b.className='doc-card';b.tabIndex=0;b.setAttribute('role','button');const icon=document.createElement('span');icon.className='doc-icon';icon.textContent='📕';const info=document.createElement('div');info.className='doc-info';const title=document.createElement('div');title.className='doc-name';title.textContent=d.name;const meta=document.createElement('div');meta.className='doc-meta';meta.textContent=d.subject+' / '+d.type+' · '+(d.size/1024/1024).toFixed(1)+' MB';const actions=document.createElement('div');actions.className='doc-card-actions';const download=document.createElement('a');download.className='doc-download';download.href=d.url;download.download=d.name+'.pdf';download.textContent='⬇ 下载 PDF';download.setAttribute('aria-label','下载 '+d.name);download.addEventListener('click',event=>event.stopPropagation());actions.append(download);info.append(title,meta,actions);b.append(icon,info);b.addEventListener('click',()=>openDoc(d));b.addEventListener('keydown',e=>{if(e.target===b&&(e.key==='Enter'||e.key===' ')){e.preventDefault();openDoc(d)}});return b}
function renderDocs(){const q=doc$('docSearch').value.trim().toLowerCase();const sub=doc$('docSubject').value,type=doc$('docType').value;const filtered=docsState.files.filter(d=>(sub==='全部'||d.subject===sub)&&(type==='全部'||d.type===type)&&(d.name.toLowerCase().includes(q)||d.path.toLowerCase().includes(q)));const root=doc$('docList'),crumb=doc$('docBreadcrumb');root.replaceChildren();crumb.replaceChildren();const back=(label,fn)=>{const b=document.createElement('button');b.type='button';b.textContent=label;b.onclick=fn;crumb.append(b)};back('全部科目',()=>docNav(0));if(docsState.subject)back('› '+docsState.subject,()=>docNav(1,docsState.subject));if(docsState.type)back('› '+docsState.type,()=>docNav(2,docsState.subject,docsState.type));doc$('docCount').textContent='共 '+docsState.files.length+' 份 PDF · 当前范围 '+filtered.length+' 份';if(!filtered.length){root.textContent='没有符合条件的资料';return}
if(q||sub!=='全部'&&sub!==docsState.subject||type!=='全部'&&type!==docsState.type){const grid=document.createElement('div');grid.className='docs-grid';filtered.forEach(d=>grid.append(docFile(d)));root.append(grid);return}
if(docsState.level===0){for(const subject of [...new Set(filtered.map(d=>d.subject))])root.append(docFolder(subject,filtered.filter(d=>d.subject===subject).length,()=>docNav(1,subject)));return}
if(docsState.level===1){for(const category of [...new Set(filtered.map(d=>d.type))])root.append(docFolder(category,filtered.filter(d=>d.type===category).length,()=>docNav(2,docsState.subject,category)));return}
const grid=document.createElement('div');grid.className='docs-grid';filtered.forEach(d=>grid.append(docFile(d)));root.append(grid)}
for(const id of ['docSearch','docSubject','docType'])doc$(id).addEventListener(id==='docSearch'?'input':'change',()=>{if(id==='docSubject'){docsState.subject=doc$(id).value==='全部'?null:doc$(id).value;docsState.type=null;docsState.level=docsState.subject?1:0;doc$('docType').value='全部'}else if(id==='docType'){docsState.type=doc$(id).value==='全部'?null:doc$(id).value;docsState.level=docsState.type?2:(docsState.subject?1:0)}renderDocs()});
async function getPdfLib(){if(docsState.lib)return docsState.lib;const lib=await import('https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.min.mjs');lib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.10.38/pdf.worker.min.mjs';docsState.lib=lib;return lib}
async function openDoc(d){const token=++docsState.token;docsState.doc=d;try{localStorage.setItem('mine-room-last-pdf',d.path)}catch{}docsState.pdf=null;docsState.scale=1;doc$('docReader').classList.remove('hidden');doc$('docList').classList.add('hidden');doc$('docBreadcrumb').classList.add('hidden');doc$('docCount').classList.add('hidden');doc$('docSearch').closest('.docs-toolbar').classList.add('hidden');doc$('readerTitle').textContent=d.name;doc$('pdfOriginal').href=d.url;doc$('pdfOriginal').setAttribute('download',d.name+'.pdf');doc$('pdfStatus').textContent='正在下载并解析 PDF…';doc$('pdfCanvas').width=0;doc$('pdfCanvas').height=0;doc$('docReader').scrollIntoView({behavior:'smooth',block:'start'});try{const lib=await getPdfLib();const pdf=await lib.getDocument({url:d.url,withCredentials:false}).promise;if(token!==docsState.token){pdf.destroy();return}docsState.pdf=pdf;const saved=Number(localStorage.getItem('mine-pdf-page:'+d.path))||1;docsState.page=Math.max(1,Math.min(pdf.numPages,saved));await drawPdf()}catch(e){if(token===docsState.token)doc$('pdfStatus').textContent='阅读器加载失败：'+e.message+'。可点击“原文件”直接打开 PDF。'}}
async function drawPdf(){if(!docsState.pdf||docsState.rendering)return;docsState.rendering=true;const pdf=docsState.pdf,token=docsState.token,pageNo=docsState.page;try{const page=await pdf.getPage(pageNo);if(token!==docsState.token)return;const wrap=doc$('pdfCanvasWrap');const base=page.getViewport({scale:1});const fit=Math.min(1.7,Math.max(.35,(wrap.clientWidth-20)/base.width));const viewport=page.getViewport({scale:fit*docsState.scale});const ratio=Math.min(window.devicePixelRatio||1,2);const canvas=doc$('pdfCanvas');canvas.width=Math.floor(viewport.width*ratio);canvas.height=Math.floor(viewport.height*ratio);canvas.style.width=viewport.width+'px';canvas.style.height=viewport.height+'px';const ctx=canvas.getContext('2d');await page.render({canvasContext:ctx,viewport,transform:ratio===1?null:[ratio,0,0,ratio,0,0]}).promise;if(token!==docsState.token)return;doc$('pageNum').value=pageNo;doc$('pageNum').max=pdf.numPages;doc$('pageTotal').textContent='/ '+pdf.numPages;doc$('pdfStatus').textContent='第 '+pageNo+' / '+pdf.numPages+' 页 · 缩放 '+Math.round(docsState.scale*100)+'% · 自动记忆页码';try{localStorage.setItem('mine-pdf-page:'+docsState.doc.path,String(pageNo))}catch{}wrap.scrollTop=0;wrap.scrollLeft=0}catch(e){doc$('pdfStatus').textContent='渲染失败：'+e.message}finally{docsState.rendering=false;if(docsState.queued){const next=docsState.queued;docsState.queued=null;next()}}}
function changePdf(page,scale){if(!docsState.pdf)return;const go=()=>{docsState.page=Math.max(1,Math.min(docsState.pdf.numPages,page));docsState.scale=Math.max(.6,Math.min(3,scale));drawPdf()};if(docsState.rendering)docsState.queued=go;else go()}
doc$('prevPage').onclick=()=>changePdf(docsState.page-1,docsState.scale);doc$('nextPage').onclick=()=>changePdf(docsState.page+1,docsState.scale);doc$('pageNum').onchange=()=>changePdf(Number(doc$('pageNum').value)||1,docsState.scale);doc$('zoomOut').onclick=()=>changePdf(docsState.page,docsState.scale/1.2);doc$('zoomIn').onclick=()=>changePdf(docsState.page,docsState.scale*1.2);doc$('fitWidth').onclick=()=>changePdf(docsState.page,1);doc$('closeReader').onclick=()=>{docsState.token++;docsState.pdf?.destroy();docsState.pdf=null;docsState.doc=null;doc$('docReader').classList.add('hidden');doc$('docList').classList.remove('hidden');doc$('docBreadcrumb').classList.remove('hidden');doc$('docCount').classList.remove('hidden');doc$('docSearch').closest('.docs-toolbar').classList.remove('hidden')};
$('refreshVideos').onclick=loadVideos;
$('refreshDocs').onclick=loadDocs;
$('continueVideo').onclick=()=>{const id=localStorage.getItem('mine-room-last-video');const v=allVideos.find(x=>x.fileId===id);if(v){playVideo(v);document.querySelector('.viewer').scrollIntoView({behavior:'smooth'})}else alert('还没有观看记录，先选择一节课程吧')};
$('toggleFavorites').onclick=()=>{favoritesOnly=!favoritesOnly;$('toggleFavorites').setAttribute('aria-pressed',String(favoritesOnly));$('toggleFavorites').textContent=favoritesOnly?'★ 显示全部':'☆ 我的收藏';render()};
$('jumpList').onclick=()=>{$('videoBreadcrumb').scrollIntoView({behavior:'smooth',block:'start'})};
$('recentDoc').onclick=()=>{const path=localStorage.getItem('mine-room-last-pdf');const d=docsState.files.find(x=>x.path===path);if(d)openDoc(d);else alert('暂无阅读记录，请先打开一份 PDF')};
const cherry=document.querySelector('.cherry-bomb');cherry.onclick=()=>{switchTab('video');window.scrollTo({top:0,behavior:'smooth'})};cherry.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();cherry.click()}};
if(location.hash==='#pdf')switchTab('pdf');

loadVideos();
</script>
